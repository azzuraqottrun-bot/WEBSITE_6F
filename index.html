<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scanner Absensi QR</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef9ff;color:#17324d;font-family:Arial,sans-serif}main{max-width:560px;margin:24px auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 28px #2c78901a}h1{color:#247da8;font-size:23px;margin-top:0}.muted{color:#688b9d;font-size:14px}#reader{width:100%;margin:18px auto;border-radius:14px;overflow:hidden}button{border:0;border-radius:10px;padding:12px 16px;background:#54b7e6;color:#fff;font-weight:bold;cursor:pointer}button.secondary{background:#e4f5fc;color:#287da8}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}#message{padding:12px;background:#f3faff;border-radius:10px;margin-top:14px;white-space:pre-wrap}#result{margin-top:14px;padding:14px;border-radius:12px;background:#e8fff1;color:#276f45;display:none}input{width:100%;padding:12px;border:1px solid #c9e8f7;border-radius:10px;margin:8px 0}.small{font-size:12px;color:#7895a5;line-height:1.5}
</style></head><body><main><section class="card"><h1>📷 Scanner Absensi QR</h1><p class="muted">Scan QR siswa. Hasil dikirim langsung ke Google Apps Script dan Spreadsheet.</p><div id="reader"></div>
<div class="actions"><button id="startBtn" onclick="startScanner()">Mulai Kamera</button><button class="secondary" onclick="stopScanner()">Stop Kamera</button></div>
<div id="message">Memeriksa sesi login...</div><div id="result"></div><hr style="border:0;border-top:1px solid #e6f2f7;margin:20px 0">
<label for="manual">Input kode QR manual</label><input id="manual" placeholder="Masukkan kode QR / ID Siswa"><div class="actions"><button onclick="manualScan()">Proses</button></div>
<p class="small">Kamera membutuhkan HTTPS. Jangan bagikan URL halaman scanner yang memuat token sesi.</p></section></main>
<script>
const params=new URLSearchParams(location.search),TOKEN=params.get('token')||'',GAS_URL=params.get('gas')||'';
let scanner=null,running=false,busy=false,lastValue='';
const message=t=>document.getElementById('message').textContent=t;
function validate(){if(!TOKEN||!GAS_URL||!/^https:\/\/script\.google\.com\/macros\/s\//.test(GAS_URL)){message('Sesi tidak lengkap/kedaluwarsa. Kembali ke website utama dan login ulang.');document.getElementById('startBtn').disabled=true;return false;}message('Sesi siap. Tekan Mulai Kamera.');return true;}
function startScanner(){if(!validate()||running)return;if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){message('Kamera memerlukan HTTPS dan dukungan browser.');return;}scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},v=>submitQR(v),()=>{}).then(()=>{running=true;message('Kamera aktif. Arahkan QR ke kotak scan.');}).catch(e=>message('Kamera gagal dibuka: '+(e?.message||e)));}
function stopScanner(){if(!scanner||!running)return;scanner.stop().then(()=>{running=false;message('Kamera dihentikan.');}).catch(e=>message('Gagal menghentikan kamera: '+e));}
function manualScan(){const v=document.getElementById('manual').value.trim();if(v)submitQR(v);else message('Masukkan kode QR terlebih dahulu.');}
function submitQR(value){if(busy||!value||value===lastValue)return;busy=true;lastValue=value;message('Mengirim hasil scan ke database...');const cb='scanCb_'+Date.now()+'_'+Math.floor(Math.random()*100000),script=document.createElement('script');const timeout=setTimeout(()=>{clean();busy=false;lastValue='';message('Server tidak merespons. Periksa internet/deployment GAS.');},20000);function clean(){clearTimeout(timeout);try{delete window[cb]}catch(e){}script.remove();}
window[cb]=data=>{clean();busy=false;if(data?.success){const s=data.siswa||{};document.getElementById('result').style.display='block';document.getElementById('result').textContent='✓ Absensi berhasil — '+(s.nama||'')+' | '+(s.id||'')+' | '+(s.kelas||'');message(data.message||'Berhasil dicatat.');if(running)stopScanner();}else{message(data?.message||'QR gagal diproses.');lastValue='';}};
const u=new URL(GAS_URL);u.searchParams.set('api','scan');u.searchParams.set('token',TOKEN);u.searchParams.set('qr',value);u.searchParams.set('callback',cb);script.src=u.toString();script.onerror=()=>{clean();busy=false;lastValue='';message('Tidak dapat terhubung ke endpoint GAS.');};document.body.appendChild(script);document.getElementById('manual').value='';}
validate();window.addEventListener('pagehide',stopScanner);
</script></body></html>
